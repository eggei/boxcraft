<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The light-boxed cut of the mark, which holds up against both the light
      and dark browser chrome a tab can sit in. The in-app header swaps between
      this and logo-dark.png with the theme — see the Logo in src/App.tsx.
    -->
    <link rel="icon" type="image/png" href="/logo-light.png" />
    <link rel="apple-touch-icon" href="/logo-light.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoxCraft</title>
    <!--
      Apply the theme before first paint so the page never flashes light on the
      way to dark. Mirrors src/theme/theme.ts — keep the key and the fallback
      rule in sync with it.
    -->
    <script>
      try {
        var stored = localStorage.getItem('boxcraft:theme')
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      } catch (error) {
        // No stored preference available; React will settle the theme on mount.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
