<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoxCraft</title>
    <!--
      Apply the theme and palette before first paint so the page never flashes
      the wrong colours on the way in. Mirrors src/theme/theme.ts and
      src/theme/palette.ts — keep the keys, the default palette and the dark
      fallback rule in sync with them.
    -->
    <script>
      try {
        var root = document.documentElement
        var storedTheme = localStorage.getItem('boxcraft:theme')
        var dark =
          storedTheme === 'dark' ||
          (storedTheme !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        root.dataset.theme = dark ? 'dark' : 'light'
        if (dark) {
          root.classList.add('dark')
          root.style.colorScheme = 'dark'
        }

        var storedPalette = localStorage.getItem('boxcraft:palette')
        root.dataset.palette =
          storedPalette === 'graphite' || storedPalette === 'paper'
            ? storedPalette
            : 'paper'
      } catch (error) {
        // No stored preference available; React will settle both on mount.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
